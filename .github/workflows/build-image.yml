name: Test and publish Agent image
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
permissions:
  contents: read
jobs:
  agent:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.12.6"
          enable-cache: true
      - name: Test
        run: |
          uv sync --frozen
          uv run pytest -q
      - name: Build
        run: docker build --build-arg APP_VERSION="$GITHUB_SHA" --tag acc-system-agent:test .
      - uses: aws-actions/configure-aws-credentials@v6.3.0
        if: github.event_name != 'pull_request'
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Push to ECR
        if: github.event_name != 'pull_request'
        env:
          REPOSITORY: ${{ vars.ECR_AGENT_REPOSITORY }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          registry="$(aws sts get-caller-identity --query Account --output text).dkr.ecr.${AWS_REGION}.amazonaws.com"
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$registry"
          docker tag acc-system-agent:test "$registry/$REPOSITORY:$GITHUB_SHA"
          docker push "$registry/$REPOSITORY:$GITHUB_SHA"
